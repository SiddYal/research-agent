# Render blueprint: one Docker web service. Copy the values `neon deploy` wrote to
# .env: DATABASE_URL (pooled) and DATABASE_URL_UNPOOLED (direct, for migrations);
# the migration enables pgvector. The AWS_* values store reports in Neon's bucket.
# Free plan: the service sleeps after 15 idle minutes and takes about a minute to
# wake; a job interrupted by a restart resumes from its checkpoint on startup.
services:
  - type: web
    name: research-agent
    runtime: docker
    plan: free
    region: ohio  # next to the Neon database (aws us-east-2): a job makes many queries
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REPORTS_BUCKET
        value: assets
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: DAILY_COST_CAP_USD
        value: "2.00"
      - key: MAX_JOB_COST_USD
        value: "0.50"
      - key: RATE_LIMIT
        value: "5/minute"
      - key: LOG_JSON
        value: "true"
