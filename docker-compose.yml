services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@db:5432/research
      # Self-contained: ignore any Neon direct URL or bucket that .env carries.
      DATABASE_URL_UNPOOLED: ""
      REPORTS_BUCKET: ""
      REPORTS_DIR: /app/data/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - reports:/app/data/reports
    restart: unless-stopped

volumes:
  pgdata:
  reports:
